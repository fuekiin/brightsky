x-brightsky:
  &brightsky
  build: .
  depends_on:
    - postgres
    - redis
  environment:
    BRIGHTSKY_DATABASE_URL: postgres://postgres:pgpass@postgres
    BRIGHTSKY_REDIS_URL: redis://redis
  volumes:
    # nano radar3d frames: written by the radar3d worker, read by web
    - .data/radar3d:/app/.data/radar3d

services:
  postgres:
    image: postgres:17-alpine
    shm_size: 512mb
    environment:
      POSTGRES_PASSWORD: pgpass
    volumes:
      - .data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  worker:
    <<: *brightsky
    command: --migrate work
    restart: unless-stopped
  web:
    <<: *brightsky
    command: serve --bind 0.0.0.0:5000
    restart: unless-stopped
    ports:
      - 5000:5000
  radar3d:
    <<: *brightsky
    command: --migrate radar3d-work
    restart: unless-stopped
  push-api:
    <<: *brightsky
    command: push-serve --bind 0.0.0.0:5001 --forwarded-allow-ips 172.16.0.0/12
    restart: unless-stopped
  push-work:
    <<: *brightsky
    # the worker container migrates; push-work only waits for it
    command: push-work
    restart: unless-stopped
  brightsky:
    <<: *brightsky
    scale: 0
